# CrewAI 任务定义。
#
# 两个任务分别由两次 kickoff 执行（各自单任务 Crew），不由 CrewAI 的 sequential 串起来：
#   - 阶段一 Design_frontend_page   仅「用户没给设计图」时跑，产出「原始设计图」
#   - 阶段二 Implement_frontend_page 总是跑，承接设计图还原成代码
# 由 Node 侧按 D4「Node 侧确定性判定」决定跑哪些阶段，中间留出人工确认点。
#
# description 里的 {xxx} 是 kickoff(inputs={...}) 的占位符，必须全部喂到，否则 CrewAI 会报缺参。

Design_frontend_page:
  agent: User_Interface_Designer
  description: |
    用户的前端需求如下：

    ------------------------------ 需求开始 ------------------------------
    {requirement}
    ------------------------------ 需求结束 ------------------------------

    现在需要你把它整理成一张高保真整页设计稿：

    1. 先梳理画面描述，务必写清这五点：页面类型、整体布局结构（几栏/栅格/区块顺序）、
       各区块内的具体元素、配色方案（给出具体色值）、视觉风格（圆角、阴影、间距尺度）。
       同类页面里通行的布局规范要遵守（如电商首页的导航/轮播/商品网格/页脚顺序）。
    2. 用 generate_image 工具生成设计稿，调用时 **kind 必须传 "design"**，
       prompt 就用上一步整理出的画面描述。文件会存到 .front/design/AI-image/。
    3. 生成完成后，工具会自动在终端把成品画给用户看，你随后必须用 confirm 工具向用户确认是否满意。
       用户不满意：结合用户的意见补充细节（布局、配色、元素），调整 prompt 后重新生成，
       再用 confirm 确认，如此往复，直到用户明确认可为止。
    4. 用户认可的那一张，就是本次交付的「原始设计图」，后续所有还原工作都以它为准。

    注意：你只负责出设计稿并取得用户认可，**不要写任何代码**，也不要打开浏览器。
  expected_output: |
    一份设计稿交付说明，包含：
    1. 该设计稿的画面描述（布局结构、配色、核心元素），供前端工程师对照还原；
    2. 末行必须是设计稿的**绝对路径**，写成 `设计图路径：<绝对路径>` 的形式。
    用户已通过 confirm 明确认可该设计稿。

Implement_frontend_page:
  agent: Frontend_Engineer
  description: |
    用户的前端需求如下：

    ------------------------------ 需求开始 ------------------------------
    {requirement}
    ------------------------------ 需求结束 ------------------------------

    设计稿（下文称「原始设计图」）的绝对路径：

    ------------------------------ 设计图路径 ------------------------------
    {design_image_path}
    ------------------------------ 设计图路径 ------------------------------

    上面这张设计稿的机器可读说明（已由视觉模型读图后转写成文字，
    这是你还原设计的主要依据 —— 你无法直接查看图片，务必以这段文字为准）：

    ------------------------------ 设计说明开始 ------------------------------
    {design_description}
    ------------------------------ 设计说明结束 ------------------------------

    代码保存路径：

    ------------------------------ 保存路径 ------------------------------
    {save_path}
    ------------------------------ 保存路径 ------------------------------

    请把「原始设计图」一比一还原成前端页面。先按下面顺序执行：

    1. **读设计说明**：通读上面的设计说明，它已经写明页面结构、各区块元素、配色色值与
       风格尺度，照着它写代码。不要凭想象还原，也不要臆造说明里没有的颜色和元素。
       若说明里标了「看不清」的地方，按同类页面的通行做法处理，并在交付说明里注明。
       注意：你看不到设计图本身，上面这段设计说明就是你**唯一**的设计依据，
       没有别的看图途径，不要试图去找工具「看图」。
    2. **写代码**：用 Vue3 单文件组件（组合式 API + `<script setup>`）实现，
       把页面代码写到上面的保存路径下。若保存路径为空或不可用，
       必须先用 select/confirm 工具向用户问到明确路径再开工，不要自行假定。
    3. **补素材**：还原过程中若遇到设计图里有、但项目里没有现成文件的图片素材
       （图标、插画、背景图、头像、logo、占位图等）：
       - 先调用 select 工具询问用户：AI 自动生成，还是手动提供图片？
       - 选 AI 自动生成：调用 generate_image 工具生成（**不要传 kind，按缺省的素材图走**），
         存到 .front/design/AI-asset/，代码里按返回的路径引用。
       - 选手动提供：向用户问清图片位置，读取后引用。
       - 不要用纯 CSS 硬凑素材，不要留空占位块，更不要写死外部图床或网图链接。

    代码写完后，按下面顺序验证：

    4. **跑起来看效果**：用 navigate_page 打开页面 URL，再用 take_screenshot 截图
       （**必须传 filePath 把截图落到文件** —— 后面 imugi_compare 要读本地文件才能
       算出区域差异报告，只给 URL 的话拿不到），并用 list_console_messages 读取控制台日志。
    5. **问用户是否调试**：用 confirm 工具问用户是否需要调试。
       - 需要调试：若控制台有红色报错，按报错信息改代码 → 重新 navigate_page 刷新
         → 重新 take_screenshot + list_console_messages，循环直到控制台无红色报错。
         把最终这张无报错的截图记为「当前最新有效截图」。
       - 不需要调试：把第 4 步那张截图记为「当前最新有效截图」。
    6. **问用户是否对比**：用 confirm 工具问用户是否需要把「原始设计图」和
       「当前最新有效截图」做像素对比。
       - 需要对比：调用 imugi_compare 工具，designImagePath 传「原始设计图」的绝对路径，
         screenshotPath 传「当前最新有效截图」的绝对路径。它会返回一份**像素对比报告**，
         内含 SSIM 分数，以及「差异最大的若干区域」（每个区域给出网格行列、方位、
         原图像素范围和平均差异百分比）。
         - SSIM 达到达标线（见下方说明）→ 告知用户对比通过，本次交付完成。
         - 未达到：**按报告里排在前面的区域**逐一定位问题（那里最不像设计稿），
           精细调整代码 → 回到第 4 步重新打开页面并截图 → 再次调用 imugi_compare 复验。
           报告里的「差异百分比」只是「哪里最不像」的线索，不是越小越好的指标 ——
           字体抗锯齿、图片素材本身不同都会产生差异，不要为了压低数字做无意义的调整。
         - 这个「改 → 截 → 比」循环**最多执行 3 次**。3 次仍未达标，就列出剩余未匹配项，
           用 confirm 工具问用户是否继续调整，不要自己硬撑下去。
       - 不需要对比：直接交付。

    达标线说明：SSIM 是像素级相似度，设计稿与真实浏览器渲染在字体抗锯齿、图片内容上天然有差异，
    分数不可能很高。**起始达标线取 0.70**；这是未经实测标定的经验值，第一次真实跑通后应当
    按当时的实际得分回调（design_image vs 真实截图通常在 0.5~0.8 之间）。
    若这条线定得过高，循环会次次走满 3 次后抛给用户，务必留意。
  expected_output: |
    Vue3 单文件组件形式的前端页面代码（组合式 API + `<script setup>`），写在用户指定的保存路径下，
    并附一份交付说明，包含：
    1. 生成/改动的文件清单；
    2. 素材图来源（AI 生成的列出路径，手动提供的说明出处）；
    3. 调试结果（控制台是否还有报错）；
    4. 对比结果（若做了对比，给出 imugi_compare 的 SSIM 分数与结论）。
